kind: ConfigMap
apiVersion: v1
metadata:
  name: backend
  namespace: expense
data:
  DB_HOST: mysql-lb
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: backend
  namespace: expense
  # this labels are replicaset labels
  labels: 
    app: backend
    tier: expense
    purpose: deployment
spec:
  # modify replicas according to your case
  replicas: 1
  selector:
    # replicaset use these labels to find the pods for creating desired number of replicas
    matchLabels:
      app: backend
      tier: expense
      purpose: deployment
  # pod template
  template:
    metadata:
      labels:
        app: backend
        tier: expense
        purpose: deployment
    spec:
      containers:
      - name: backend
        image: niranjan2505/backend:1.0.0
        envFrom:
        - configMapRef:
            name: backend
---
kind: Service
apiVersion: v1
metadata:
  name: backend
  namespace: expense
spec: 
  selector: # labels are used as selectors
    app: backend
    tier: expense
    purpose: deployment
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
