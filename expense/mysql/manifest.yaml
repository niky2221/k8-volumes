apiVersion: v1
kind: Service
metadata:
  name: headless-service
  namespace: expense
  labels:
    project: expense
    app: mysql
    component: dev
spec:
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306
  clusterIP: None
  selector:
    app: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-lb
  namespace: expense
  labels:
    project: expense
    app: mysql
    component: dev
spec:
  selector:
    project: expense
    app: mysql
    component: dev
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306
---
apiVersion: apps/
kind: StatefulSet
metadata:
  name: mysql
  namespace: expense
spec:
  serviceName: headless-service
  selector:
    matchLabels:
      project: expense
      app: mysql
      component: dev
  replicas: 2
  minReadySeconds: 10
  template:
    metadata:
      labels:
        project: expense
        app: mysql
        component: dev
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: mysql
        image: niranjan2505/mysql:1.0.0
      volumeMounts:
      - name: mysql
        mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: mysql
      namespace: expense
    spec: 
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "ebs-sc"
      resources:
          requests:
            storage: 1Gi



    

    
